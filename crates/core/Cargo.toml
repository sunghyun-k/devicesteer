[package]
name = "devicesteer-core"
description = "Device layer for DeviceSteer: connection, tunnel and services over idevice"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
idevice.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
plist = "1.8"
tracing.workspace = true
uuid.workspace = true
# Checks the downloaded Developer Disk Image against pinned hashes.
sha2 = "0.10"
# MP4 boxes for recordings (Apache-2.0). 2026.4+ needs rustc 1.93; the workspace builds on 1.88.
shiguredo_mp4 = "=2026.3.0"
# Screenshots: the device's 16-bit PNG is saved 8-bit (PITFALLS #63).
png = "0.18"
# Finds devices on the local network (`_remotepairing._tcp`) on macOS, and advertises this computer
# for pairing; Windows finds devices through its own mDNS responder instead (PITFALLS #67).
mdns-sd = { version = "0.22", default-features = false, features = ["async"] }

[dev-dependencies]
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_NetworkManagement_Dns"] }
