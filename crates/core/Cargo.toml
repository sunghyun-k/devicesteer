[package]
name = "iphone-use-core"
description = "Device layer for iphone-use: connection, tunnel and services over idevice"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
idevice.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
plist = "1.8"
tracing.workspace = true
uuid.workspace = true
# Checks the downloaded Developer Disk Image against pinned hashes.
sha2 = "0.10"
# MP4 boxes for recordings (Apache-2.0). 2026.4+ needs rustc 1.93; the workspace builds on 1.88.
shiguredo_mp4 = "=2026.3.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
