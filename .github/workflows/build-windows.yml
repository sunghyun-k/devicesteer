# Builds the Windows installer (NSIS, x64) with the CLI and the skill inside, and checks what is in
# it. Runs on pull requests and pushes to main that touch what goes into the app, by hand, and as
# the build step of release-windows.yml (workflow_call), which attaches the result to a draft
# release. The installer is kept as a workflow artifact for a week, to try it on a Windows PC.
#
# GitHub-hosted runner on purpose: SignPath's open-source signing accepts only builds whose every
# job ran on GitHub-hosted runners (see the outline in release-windows.yml).
name: Windows build

on:
  pull_request:
    paths:
      - "app/**"
      - "crates/**"
      - "skills/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/build-cli.sh"
      - "scripts/check-version.sh"
      - "scripts/install.ps1"
      - ".github/workflows/build-windows.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "crates/**"
      - "skills/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/build-cli.sh"
      - "scripts/check-version.sh"
      - "scripts/install.ps1"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Commit to build (default: the triggering ref)"
        type: string
        default: ""
      version:
        description: "Version the build must carry (checked against Cargo.toml, tauri.conf.json and package.json)"
        type: string
        default: ""
    outputs:
      artifact:
        description: Name of the workflow artifact that holds the installer
        value: ${{ jobs.bundle.outputs.artifact }}
      installer:
        description: The installer's file name
        value: ${{ jobs.bundle.outputs.installer }}

permissions: {}

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bundle:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.check.outputs.artifact }}
      installer: ${{ steps.check.outputs.installer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Check the version
        if: inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: scripts/check-version.sh "$VERSION"

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install the front end's packages
        working-directory: app
        run: npm ci

      # `npm run bundle` adds tauri.bundle.conf.json: its beforeBuildCommand builds the CLI with
      # scripts/build-cli.sh (under Git for Windows' sh) and bundles it with the skill.
      # --- SignPath, once approved: the installer can't be signed from the outside only, the exes
      # --- inside it must be signed before NSIS packs them. Replace this step with:
      #   1. npm run bundle -- --no-bundle            (builds devicesteer-app.exe and the CLI)
      #   2. actions/upload-artifact of target/release/devicesteer-app.exe and
      #      app/src-tauri/binaries/devicesteer-x86_64-pc-windows-msvc.exe (keep its artifact-id)
      #   3. signpath/github-action-submit-signing-request (pinned by SHA) with
      #      secrets.SIGNPATH_API_TOKEN, organization-id, project-slug, signing-policy-slug,
      #      artifact-configuration-slug (a zip of pe-files, product-name DeviceSteer and
      #      product-version restricted), github-artifact-id, wait-for-completion: true,
      #      wait-for-completion-timeout-in-seconds: 7200 (every request waits for a manual approval)
      #   4. copy the signed exes back over both paths
      #   5. npx tauri bundle --bundles nsis --config src-tauri/tauri.bundle.conf.json
      #   6. upload the setup.exe and submit it to SignPath again (pe-file), use the signed one
      # The updater signature is made after all of this, on the release Mac (scripts/release.sh
      # --windows), so it covers the final, Authenticode-signed installer.
      - name: Build the installer
        working-directory: app
        run: npm run bundle -- --bundles nsis

      - name: Check the installer
        id: check
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'require("./app/src-tauri/tauri.conf.json").version')
          installer="DeviceSteer_${version}_x64-setup.exe"
          setup="target/release/bundle/nsis/$installer"
          [ -f "$setup" ] || { ls -l target/release/bundle/nsis || true; echo "no $setup"; exit 1; }

          cli=app/src-tauri/binaries/devicesteer-x86_64-pc-windows-msvc.exe
          [ "$("$cli" --version | tr -d '\r')" = "devicesteer $version" ] || { echo "the CLI reports another version"; exit 1; }
          # File metadata SignPath requires: ProductName and ProductVersion on every exe.
          for exe in "$cli" target/release/devicesteer-app.exe; do
            info=$(powershell -NoProfile -Command "\$v = (Get-Item '$exe').VersionInfo; \"\$(\$v.ProductName)|\$(\$v.ProductVersion)\"" | tr -d '\r')
            echo "$exe: $info"
            [ "${info%%|*}" = DeviceSteer ] || { echo "$exe: ProductName isn't DeviceSteer"; exit 1; }
            [ "${info#*|}" = "$version" ] || { echo "$exe: ProductVersion isn't $version"; exit 1; }
          done

          # 7-Zip reads NSIS installers: check the CLI and the skill are inside, where
          # agent_setup.rs looks for them (next to the app, and under skills\).
          listing=$(7z l "$setup" | tr -d '\r')
          for f in devicesteer-app.exe devicesteer.exe 'skills\devicesteer\SKILL.md'; do
            grep -qiF -- "$f" <<<"$listing" || { echo "$listing"; echo "the installer lacks $f"; exit 1; }
          done

          sha256sum "$setup"
          echo "installer=$installer" >> "$GITHUB_OUTPUT"
          echo "artifact=windows-installer" >> "$GITHUB_OUTPUT"
          echo "setup=$setup" >> "$GITHUB_OUTPUT"

      # Installs silently (as scripts/install.ps1 does), reinstalls over it while the CLI runs from
      # a hard link (as Settings › Agents makes one), and uninstalls: the installer hooks must stop
      # that process, or the reinstall can't overwrite devicesteer.exe.
      - name: Install, reinstall and uninstall
        shell: pwsh
        env:
          SETUP: ${{ steps.check.outputs.setup }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:LOCALAPPDATA 'DeviceSteer'
          function Install {
            $p = Start-Process -FilePath $env:SETUP -ArgumentList '/S' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "the installer exited with $($p.ExitCode)" }
          }
          # State an older build left in the install folder (crates/core/src/paths.rs): the first
          # CLI run moves it to the state folder, and the uninstall keeps it there.
          $state = Join-Path $env:LOCALAPPDATA 'com.sunghyunkim.devicesteer'
          New-Item -ItemType Directory -Force (Join-Path $dir 'remote-pairing') | Out-Null
          Set-Content (Join-Path $dir 'remote-pairing\test.plist') 'test'
          Install
          foreach ($f in 'devicesteer-app.exe', 'devicesteer.exe', 'skills\devicesteer\SKILL.md', 'uninstall.exe') {
            if (-not (Test-Path (Join-Path $dir $f))) { Get-ChildItem -Recurse $dir; throw "the install lacks $f" }
          }
          & (Join-Path $dir 'devicesteer.exe') --version
          # `devices` reads the Wi-Fi pairings; without usbmuxd it may fail, which doesn't matter here.
          & (Join-Path $dir 'devicesteer.exe') devices 2>&1 | Out-Host
          $global:LASTEXITCODE = 0
          if (-not (Test-Path (Join-Path $state 'remote-pairing\test.plist'))) { throw "the CLI didn't move the old state to $state" }
          if (Test-Path (Join-Path $dir 'remote-pairing')) { throw 'the CLI left the old state in the install folder' }

          # Where Settings › Agents puts it; a hard link must be on the install's volume (the
          # runner's temp folder is on another drive).
          $bin = Join-Path $env:USERPROFILE '.local\bin'
          New-Item -ItemType Directory -Force $bin | Out-Null
          $link = Join-Path $bin 'devicesteer.exe'
          New-Item -ItemType HardLink -Path $link -Target (Join-Path $dir 'devicesteer.exe') | Out-Null
          # A daemon needs a device (or usbmuxd); `setup wifi` doesn't: it advertises this computer
          # and waits for a device to pair, which makes it a running CLI process like a daemon.
          $log = Join-Path $env:RUNNER_TEMP 'cli.log'
          $daemon = Start-Process -FilePath $link -ArgumentList 'setup', 'wifi', '--wait', '600' -PassThru -RedirectStandardError $log
          Start-Sleep -Seconds 5
          if ($daemon.HasExited) { Get-Content $log; throw 'the test CLI process exited by itself' }
          Install
          if (-not $daemon.HasExited) { throw 'the reinstall left the CLI process running' }
          & (Join-Path $dir 'devicesteer.exe') --version
          # The installer overwrites files in place, so the hard link is still the installed CLI
          # (docs/SETUP.md relies on this for updates).
          $names = fsutil hardlink list (Join-Path $dir 'devicesteer.exe')
          $names
          if (-not ($names | Where-Object { $_ -like '*\.local\bin\devicesteer.exe' })) { throw 'the reinstall replaced the CLI file, cutting the hard link' }

          $daemon = Start-Process -FilePath $link -ArgumentList 'setup', 'wifi', '--wait', '600' -PassThru -RedirectStandardError $log
          Start-Sleep -Seconds 5
          if ($daemon.HasExited) { Get-Content $log; throw 'the test CLI process exited by itself' }

          # `_?=` runs the uninstaller in place, so this waits for it (it can't delete itself then).
          $p = Start-Process -FilePath (Join-Path $dir 'uninstall.exe') -ArgumentList '/S', "_?=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the uninstaller exited with $($p.ExitCode)" }
          if (-not $daemon.HasExited) { throw 'the uninstall left the CLI process running' }
          foreach ($f in 'devicesteer-app.exe', 'devicesteer.exe', 'skills\devicesteer\SKILL.md') {
            if (Test-Path (Join-Path $dir $f)) { throw "the uninstall left $f" }
          }
          if (-not (Test-Path (Join-Path $state 'remote-pairing\test.plist'))) { throw 'the uninstall deleted the state' }

      - name: Check install.ps1 parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; throw 'scripts/install.ps1 has syntax errors' }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.check.outputs.artifact }}
          path: ${{ steps.check.outputs.setup }}
          if-no-files-found: error
          retention-days: 7
