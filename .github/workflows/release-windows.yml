# Builds the Windows installer for a release and attaches it to the release's draft. Run it after
# scripts/release.sh has made the draft v<version> on the release Mac; `scripts/release.sh
# --windows` starts it by itself. It builds the commit the draft points at, so the Windows build is
# the same source as the macOS one.
#
# It uploads the installer as DeviceSteer_x64-setup.exe (no version: the homepage links to
# releases/latest/download/DeviceSteer_x64-setup.exe), scripts/install.ps1 (the PowerShell installer,
# `irm .../releases/latest/download/install.ps1 | iex`) and SHA256SUMS for both. The updater signature and the
# `windows-x86_64` entry in latest.json are made on the release Mac, which alone holds the updater
# key (docs/RELEASING.md). It never publishes the release and refuses a release that isn't a draft.
#
# Code signing isn't set up: the installer is unsigned (SmartScreen warns; README). The SignPath
# steps go into build-windows.yml, where the outline is.
name: Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, for example 1.0.0 (the draft release v<version> must exist)"
        required: true
        type: string

permissions: {}

concurrency:
  group: windows-release-${{ inputs.version }}

jobs:
  draft:
    name: Find the draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Drafts are visible only with write access.
      contents: write
    outputs:
      commit: ${{ steps.draft.outputs.commit }}
      version: ${{ steps.draft.outputs.version }}
    steps:
      - id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=${INPUT_VERSION#v}
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::'$INPUT_VERSION' isn't a version like 1.0.0"; exit 1; }
          release=$(gh release view "v$version" --json isDraft,targetCommitish) \
            || { echo "::error::no release v$version: run scripts/release.sh $version on the release Mac first"; exit 1; }
          [ "$(jq -r .isDraft <<<"$release")" = true ] || { echo "::error::v$version is already published; the workflow only adds to drafts"; exit 1; }
          commit=$(jq -r .targetCommitish <<<"$release")
          echo "Draft v$version points at $commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: draft
    permissions:
      contents: read
    uses: ./.github/workflows/build-windows.yml
    with:
      ref: ${{ needs.draft.outputs.commit }}
      version: ${{ needs.draft.outputs.version }}

  upload:
    name: Attach to the draft
    needs: [draft, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # install.ps1 from the release's commit, attached so that
      # releases/latest/download/install.ps1 always matches the latest release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.draft.outputs.commit }}
          persist-credentials: false
          sparse-checkout: scripts/install.ps1
          sparse-checkout-cone-mode: false
          path: src
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: installer
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.draft.outputs.version }}
          INSTALLER: ${{ needs.build.outputs.installer }}
        run: |
          set -euo pipefail
          [ "$INSTALLER" = "DeviceSteer_${VERSION}_x64-setup.exe" ] || { echo "::error::unexpected installer name $INSTALLER"; exit 1; }
          # Checked again: someone may have published it while this ran.
          [ "$(gh release view "v$VERSION" --json isDraft -q .isDraft)" = true ] || { echo "::error::v$VERSION was published meanwhile; not uploading"; exit 1; }
          # Tauri names the installer after the version; the release asset has none, so that
          # releases/latest/download/DeviceSteer_x64-setup.exe (the homepage's link) always works.
          asset=DeviceSteer_x64-setup.exe
          mv "installer/$INSTALLER" "installer/$asset"
          cp src/scripts/install.ps1 installer/install.ps1
          # install.ps1 checks the installer against this before running it.
          (cd installer && sha256sum "$asset" install.ps1 > SHA256SUMS && cat SHA256SUMS)
          gh release upload "v$VERSION" "installer/$asset" installer/install.ps1 installer/SHA256SUMS --clobber
