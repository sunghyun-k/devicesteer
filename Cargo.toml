[workspace]
resolver = "2"
members = ["crates/core", "crates/daemon", "crates/agents", "crates/cli", "app/src-tauri"]

[workspace.package]
version = "1.0.0-beta.6"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
# Pinned to a commit, not crates.io: fixes to the tunnel, usbmuxd, RSD and TSS code landed after
# 0.1.68 and are not released yet. Move the pin deliberately and re-run the device checks.
idevice = { git = "https://github.com/jkcoxson/idevice", rev = "c8fff6d7fb2690eaeb591ce510754effa7b1e19b", default-features = false, features = [
  # `ring` instead of the default `aws-lc`: no CMake/NASM needed to build on Windows.
  "ring",
  "usbmuxd",
  "tcp",
  "heartbeat",
  "core_device_proxy",
  "tunnel_tcp_stack",
  "rsd",
  "xpc",
  "core_device",
  # Screen-sharing media streams and CoreDevice HID (touch, buttons).
  "display_stream",
  # DTX, for the accessibility service.
  "dvt",
  # App names and bundle ids for `ui` (CoreDevice's app list is too slow).
  "installation_proxy",
  # Device setup (`setup`): pairing, the Developer Mode switch, and mounting the personalized
  # Developer Disk Image, signed through Apple's TSS server.
  "pair",
  "amfi",
  "mobile_image_mounter",
  "tss",
  # Wi-Fi without usbmuxd: CoreDevice's own remote pairing over `_remotepairing._tcp`, then a
  # TLS-PSK tunnel to the device (PITFALLS #50).
  "remote_pairing",
] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
devicesteer-core = { path = "crates/core" }
devicesteer-daemon = { path = "crates/daemon" }
devicesteer-agents = { path = "crates/agents" }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"

# Pairing generates a 2048-bit RSA key; unoptimized, that takes many seconds in debug builds.
[profile.dev.package.rsa]
opt-level = 3
[profile.dev.package.num-bigint-dig]
opt-level = 3
# A screenshot is a 12 MB PNG to decode and re-encode, and over Wi-Fi it comes through the tunnel's
# AES-CBC and HMAC: unoptimized, both cost seconds in debug builds (PITFALLS #63).
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
