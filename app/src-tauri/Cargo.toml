[package]
name = "devicesteer-app"
description = "DeviceSteer viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "devicesteer_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
devicesteer-core.workspace = true
devicesteer-daemon.workspace = true
tokio.workspace = true
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
arboard = { version = "3.7.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray"] }
