<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iphone-use</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="picker">
      <header>
        <h1>Devices</h1>
        <button id="refresh" type="button">Refresh</button>
      </header>
      <p id="status" role="status"></p>
      <ul id="devices"></ul>
    </main>
    <section id="viewer" hidden>
      <header class="bar">
        <button id="back" type="button" aria-label="Back to devices">‹</button>
        <span id="device-name"></span>
        <span id="agent-badge" hidden>Agent is driving</span>
        <span class="spacer"></span>
        <button id="home" type="button">Home</button>
        <button id="take-over" type="button">Take over</button>
        <button id="stop-agent" type="button">Stop agent</button>
      </header>
      <div id="stage">
        <canvas id="screen"></canvas>
        <div id="overlay"></div>
      </div>
      <p id="viewer-status" role="status"></p>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
